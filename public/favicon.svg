<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Luna (moon) -->
  <circle cx="30" cy="30" r="20" fill="url(#gradient)" opacity="0.8"/>
  <circle cx="25" cy="25" r="3" fill="white" opacity="0.6"/>
  <circle cx="35" cy="28" r="2" fill="white" opacity="0.4"/>
  
  <!-- Circuit pattern -->
  <path d="M55 20 L75 20 L75 40 L85 40" stroke="url(#gradient)" stroke-width="3" fill="none"/>
  <path d="M60 45 L70 45 L70 55 L80 55" stroke="url(#gradient)" stroke-width="2" fill="none"/>
  <circle cx="75" cy="20" r="2" fill="url(#gradient)"/>
  <circle cx="85" cy="40" r="2" fill="url(#gradient)"/>
  <circle cx="80" cy="55" r="2" fill="url(#gradient)"/>
  
  <!-- Company name indicator -->
  <text x="15" y="75" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#gradient)">Lunae</text>
  <text x="15" y="88" font-family="Arial, sans-serif" font-size="8" fill="url(#gradient)" opacity="0.8">Solutions</text>
</svg>